<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AtendeAI | Atendimento Inteligente</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="app">

        <!-- ======================================
             MENU LATERAL
        ======================================= -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    🤖
                </div>

                <div>
                    <h2>AtendeAI</h2>
                    <span>Central de atendimento</span>
                </div>

            </div>


            <div class="sidebar-title">
                CONVERSAS
            </div>


            <div id="lista-conversas">
                <!-- Clientes carregados pelo JavaScript -->
            </div>

        </aside>


        <!-- ======================================
             ÁREA DO CHAT
        ======================================= -->

        <main class="chat-area">

            <header class="chat-header">

                <div>

                    <h3 id="chat-cliente-nome">
                        Selecione uma conversa
                    </h3>

                    <span class="online">
                        ● Atendimento online
                    </span>

                </div>


                <div
                    id="chat-status-ia"
                    class="ai-status"
                >
                    ✨ IA
                </div>

            </header>


            <!-- MENSAGENS -->

            <div
                id="chat"
                class="chat-messages"
            >

                <div class="message bot">

                    <div class="message-name">
                        🤖 AtendeAI
                    </div>

                    <div class="bubble">
                        Selecione uma conversa para iniciar.
                    </div>

                </div>

            </div>


            <!-- CAMPO DE MENSAGEM -->

            <div class="input-area">

                <input
                    type="text"
                    id="mensagem"
                    placeholder="Digite uma mensagem..."
                    autocomplete="off"
                >

                <button
                    id="btn-enviar"
                    onclick="enviarMensagem()"
                >
                    ➤
                </button>

            </div>

        </main>


        <!-- ======================================
             INFORMAÇÕES DO CLIENTE
        ======================================= -->

        <aside class="client-panel">


            <div
                id="cliente-avatar"
                class="client-avatar"
            >
                ?
            </div>


            <h2 id="cliente-nome">
                Nenhum cliente
            </h2>


            <span
                id="cliente-canal"
                class="client-channel"
            >
                —
            </span>


            <div class="divider"></div>


            <!-- STATUS -->

            <div class="info">

                <span>
                    STATUS
                </span>

                <strong class="status-active">
                    ● Em atendimento
                </strong>

            </div>


            <!-- MODO DE ATENDIMENTO -->

            <div class="info">

                <span>
                    ATENDIMENTO
                </span>

                <strong id="modo-atendimento">
                    ✨ Inteligência Artificial
                </strong>

            </div>


            <!-- INTERESSE -->

            <div class="info">

                <span>
                    INTERESSE
                </span>

                <strong id="cliente-interesse">
                    Não identificado
                </strong>

            </div>


            <!-- ASSUMIR ATENDIMENTO -->

            <button
                id="btn-assumir"
                class="take-button"
                onclick="alternarAtendimento()"
            >
                👤 Assumir atendimento
            </button>

        </aside>

    </div>


    <script
        src="{{ url_for('static', filename='js/chat.js') }}"
    ></script>

</body>

</html>
